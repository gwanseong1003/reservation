<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4CAF50">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>높은뜻안성교회 장소 예약</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --green:#4CAF50; --green-dark:#388E3C; --green-bg:#e8f5e9;
  --red:#f44336; --my-bg:#ffebee; --my-fg:#c62828; --my-border:#ef9a9a;
  --other-bg:#e3f2fd; --other-fg:#1565c0; --other-border:#90caf9;
  --purple-bg:#F3E5F5; --purple-fg:#6A1B9A; --purple-border:#CE93D8;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html{ -webkit-text-size-adjust:100%; }
body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif; background:#f5f5f5; overscroll-behavior-y:contain; }
.container{ max-width:600px; margin:0 auto; background:#fff; min-height:100vh; min-height:100dvh; padding-bottom:calc(30px + var(--safe-bottom)); }
.header{
  background:var(--green); color:#fff;
  padding:calc(14px + env(safe-area-inset-top,0px)) 92px 14px;
  text-align:center; font-size:18px; font-weight:bold;
  position:sticky; top:0; z-index:100; box-shadow:0 2px 4px rgba(0,0,0,.1);
}
.header .live-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#A5D6A7; margin-left:8px; vertical-align:middle; }
.header .live-dot.on{ background:#FFEB3B; animation:pulse 2s infinite; }
.header .admin-link{
  position:absolute; right:12px; bottom:11px;
  background:rgba(255,255,255,.18); color:#fff; border:none;
  border-radius:8px; padding:7px 11px; font-size:12px; font-weight:bold;
  touch-action:manipulation;
}
.header .admin-link:active{ background:rgba(255,255,255,.32); }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }
.screen{ display:none; padding:16px; }
.screen.active{ display:block; }

/* 상단 액션 */
.top-action{ margin-bottom:14px; }
.btn-add{
  width:100%; padding:16px; font-size:19px; font-weight:bold;
  background:var(--green); color:#fff; border:none; border-radius:10px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  touch-action:manipulation; transition:transform .08s;
}
.btn-add:active{ background:#45a049; transform:scale(.99); }
.btn-add .plus{ font-size:22px; line-height:1; }

/* 달력 */
.calendar-nav{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:10px 12px; background:#f9f9f9; border-radius:10px; }
.calendar-nav button{ background:var(--green); color:#fff; border:none; padding:11px 18px; font-size:17px; border-radius:8px; font-weight:bold; touch-action:manipulation; }
.calendar-nav button:active{ background:#45a049; }
.calendar-nav .date-display{ font-size:20px; font-weight:bold; color:#333; }
.legend{ font-size:13px; line-height:1.7; margin-bottom:6px; }
.legend .my{ color:var(--my-fg); font-weight:bold; }
.legend .ot{ color:var(--other-fg); font-weight:bold; }
.legend-info{ font-size:12.5px; color:#777; background:#fafafa; border-radius:8px; padding:8px 10px; margin-bottom:14px; line-height:1.7; }
.calendar-table{ width:100%; border-collapse:collapse; table-layout:fixed; margin-bottom:20px; }
.calendar-table th{ background:#87CEEB; color:#333; padding:10px 2px; font-size:14px; font-weight:bold; border:1px solid #ddd; }
.calendar-table th:first-child{ color:var(--red); }
.calendar-table th:last-child{ color:#2196F3; }
.calendar-table td{ border:1px solid #ddd; padding:5px 2px; vertical-align:top; height:84px; background:#fff; cursor:pointer; }
.calendar-table td:active{ background:#f0f0f0; }
.calendar-table td.other-month{ background:#f9f9f9; color:#ccc; }
.calendar-table td.today .date-number{ background:var(--green); color:#fff; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; }
.calendar-table td.sunday .date-number{ color:var(--red); }
.calendar-table td.today.sunday .date-number{ color:#fff; }
.calendar-table td.saturday .date-number{ color:#2196F3; }
.calendar-table td.today.saturday .date-number{ color:#fff; }
.date-number{ font-size:14px; font-weight:bold; margin-bottom:3px; }
.badge{ font-size:10.5px; padding:2px 3px; margin:1px 0; border-radius:4px; display:block; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4; }
.badge.my{ background:var(--my-bg); color:var(--my-fg); border:1px solid var(--my-border); }
.badge.other{ background:var(--other-bg); color:var(--other-fg); border:1px solid var(--other-border); }
.event-label{ display:block; font-size:10px; font-weight:bold; padding:1px 3px; margin:1px 0; border-radius:4px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4; background:var(--purple-bg); color:var(--purple-fg); border:1px solid var(--purple-border); }

/* 일정 추가 */
.date-editor{ background:var(--green-bg); border-radius:10px; padding:12px; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.date-editor input[type="date"]{ flex:1; padding:12px; font-size:17px; font-weight:bold; border:2px solid var(--green); border-radius:8px; background:#fff; color:#2e7d32; text-align:center; }
.date-editor .dow{ font-size:17px; font-weight:bold; color:#2e7d32; min-width:34px; text-align:center; }
.add-layout{ display:grid; grid-template-columns:1fr 150px; gap:12px; align-items:start; }
.side-panel{ background:#fafafa; border:1px solid #e0e0e0; border-radius:10px; padding:10px; position:sticky; top:calc(62px + env(safe-area-inset-top,0px)); }
.side-title{ font-size:12.5px; font-weight:bold; color:#555; padding-bottom:6px; margin-bottom:6px; border-bottom:1px solid #ddd; }
.side-room{ margin-bottom:10px; }
.side-room-name{ font-size:11.5px; font-weight:bold; color:#2e7d32; margin-bottom:2px; }
.side-slot{
  font-size:10.5px; color:#666; line-height:1.45;
  padding:3px 5px; margin-bottom:3px;
  background:#fff; border:1px solid #e8e8e8; border-radius:5px;
}
.side-slot .ss-time{ display:block; font-weight:bold; color:#444; }
.side-slot .ss-purpose{
  display:block; color:#888;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.side-empty{ font-size:11.5px; color:#999; text-align:center; padding:12px 0; }

.form-group{ margin-bottom:16px; }
label{ display:block; font-size:15px; font-weight:bold; margin-bottom:6px; color:#333; }
input[type="text"],input[type="tel"],input[type="number"],select,textarea{
  width:100%; padding:13px; font-size:16px; border:2px solid #ddd; border-radius:8px;
  outline:none; background:#fff; appearance:none; -webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{ border-color:var(--green); }
.identity-box{ background:#FFF8E1; border:1px solid #FFE082; border-radius:10px; padding:12px; margin-bottom:16px; }
.identity-box .ibox-title{ font-size:13px; font-weight:bold; color:#E65100; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.identity-box .ibox-title .reset-id{ background:none; border:none; color:#E65100; font-size:11.5px; text-decoration:underline; padding:0; }
.identity-box .form-group{ margin-bottom:10px; }
.identity-box .form-group:last-child{ margin-bottom:0; }
.identity-box label{ font-size:13.5px; }
.identity-box input{ padding:11px; font-size:15px; }
.time-row{ display:flex; gap:6px; }
.time-row select{ flex:1; padding:12px 6px; font-size:15px; text-align:center; }
.room-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.room-card{ border:2px solid #ddd; border-radius:8px; padding:11px 6px; text-align:center; cursor:pointer; touch-action:manipulation; transition:transform .08s; }
.room-card.selected{ border-color:var(--green); background:var(--green-bg); }
.room-card:active{ transform:scale(.97); }
.room-name{ font-size:14px; font-weight:bold; color:#333; }
.room-meta{ font-size:11.5px; color:#777; margin-top:2px; }
.repeat-opts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.repeat-opt{ border:2px solid #ddd; border-radius:8px; padding:12px 4px; text-align:center; font-size:15px; font-weight:bold; cursor:pointer; touch-action:manipulation; }
.repeat-opt.selected{ border-color:var(--green); background:var(--green-bg); color:#2e7d32; }
.btn{ width:100%; padding:15px; font-size:18px; font-weight:bold; border:none; border-radius:10px; margin-top:8px; cursor:pointer; touch-action:manipulation; transition:transform .08s; }
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.5; }
.btn-primary{ background:var(--green); color:#fff; }
.btn-secondary{ background:#757575; color:#fff; }
.btn-danger{ background:var(--red); color:#fff; }
.hidden{ display:none !important; }

/* 내 예약 */
.my-title{ font-size:19px; font-weight:bold; margin-bottom:12px; color:#333; }
.resv-item{ background:#ffe0b2; border:2px solid #ff9800; border-radius:10px; padding:14px; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
.resv-date{ font-size:17px; font-weight:bold; color:#e65100; }
.resv-room{ font-size:16px; font-weight:bold; color:#333; }
.resv-time{ font-size:15px; color:#555; }
.resv-info{ font-size:14px; color:#666; }
.btn-group{ display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.btn-mini{ border:none; color:#fff; padding:11px 15px; font-size:14px; border-radius:8px; font-weight:bold; touch-action:manipulation; }
.btn-edit{ background:var(--green-dark); }
.btn-cancel{ background:var(--red); }
.empty-msg{ text-align:center; color:#999; padding:24px 12px; font-size:15px; line-height:1.7; }

/* 날짜별 현황 */
.date-header{ background:var(--green-bg); padding:14px; border-radius:10px; margin-bottom:16px; text-align:center; }
.date-header h2{ font-size:20px; color:#2e7d32; }
.loc-section{ margin-bottom:16px; border:1px solid #ddd; border-radius:10px; overflow:hidden; }
.loc-header{ background:var(--green); color:#fff; padding:11px 14px; font-size:16px; font-weight:bold; }
.loc-entry{ padding:12px 14px; border-bottom:1px solid #eee; }
.loc-entry:last-child{ border-bottom:none; }
.loc-entry.none{ color:#999; text-align:center; font-style:italic; font-size:14px; }
.entry-time{ font-size:16px; font-weight:bold; color:#333; margin-bottom:5px; }
.entry-info{ font-size:14px; color:#666; margin-bottom:3px; }
.event-box{
  background:var(--purple-bg); border:1px solid var(--purple-border);
  border-radius:10px; padding:12px 14px; margin-bottom:16px;
}
.event-box .eb-title{ font-size:12.5px; font-weight:bold; color:var(--purple-fg); margin-bottom:6px; }
.event-box .eb-name{ font-size:17px; font-weight:bold; color:var(--purple-fg); line-height:1.5; }

/* 로딩/모달 */
.loading{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9999; justify-content:center; align-items:center; }
.loading.show{ display:flex; }
.loading-spinner{ background:#fff; padding:26px 34px; border-radius:12px; text-align:center; }
.spinner{ border:4px solid #f3f3f3; border-top:4px solid var(--green); border-radius:50%; width:44px; height:44px; animation:spin .9s linear infinite; margin:0 auto 12px; }
@keyframes spin{ to{ transform:rotate(360deg) } }
.modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10000; justify-content:center; align-items:center; padding:20px; }
.modal.show{ display:flex; }
.modal-content{ background:#fff; padding:26px 22px; border-radius:14px; max-width:380px; width:100%; }
.modal-message{ font-size:17px; margin-bottom:22px; color:#333; text-align:center; line-height:1.6; white-space:pre-line; }
.modal-buttons{ display:flex; gap:10px; }
.modal-buttons button{ flex:1; padding:14px; font-size:17px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; }

@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
@media (max-width:400px){
  .header{ font-size:14.5px; padding-left:70px; padding-right:70px; }
  .header .admin-link{ font-size:11px; padding:6px 8px; right:8px; }
  .calendar-table td{ height:78px; }
  .badge{ font-size:9.5px; }
  .add-layout{ grid-template-columns:1fr 126px; gap:8px; }
  .side-room-name{ font-size:11px; }
  .side-slot{ font-size:9.5px; padding:3px 4px; }
  .room-name{ font-size:13px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    높은뜻안성교회 장소 예약<span class="live-dot" id="liveDot"></span>
    <button class="admin-link" onclick="location.href='admin.html'" aria-label="관리자 화면">🔒 ADMIN</button>
  </div>

  <!-- ══ 달력 (첫 화면) ══ -->
  <div id="calScreen" class="screen active">
    <div class="top-action">
      <button class="btn-add" id="addBtn"><span class="plus">＋</span> 일정 추가</button>
    </div>

    <div class="calendar-nav">
      <button id="prevBtn" aria-label="이전 달">◀</button>
      <div class="date-display"><span id="curY"></span>년 <span id="curM"></span>월</div>
      <button id="nextBtn" aria-label="다음 달">▶</button>
    </div>

    <div class="legend">
      <span class="my">내 예약은 빨강</span>, <span class="ot">다른 사람 예약은 파랑</span>으로 표시됩니다.
    </div>
    <div class="legend-info">
      1) 날짜를 누르면 그 날짜로 일정 추가 화면이 열립니다.<br>
      2) 장소 배지를 누르면 그 날의 예약 현황을 볼 수 있습니다.
    </div>

    <table class="calendar-table">
      <thead><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead>
      <tbody id="calBody"></tbody>
    </table>

    <div class="my-title">내 예약 현황</div>
    <div id="myList"></div>
  </div>

  <!-- ══ 일정 추가 / 수정 ══ -->
  <div id="addScreen" class="screen">
    <div class="date-editor">
      <input type="date" id="addDate">
      <span class="dow" id="addDow"></span>
    </div>

    <div class="add-layout">
      <div>
        <div class="identity-box">
          <div class="ibox-title">
            <span>예약자 정보</span>
            <button class="reset-id" id="resetIdBtn">다른 사람으로 변경</button>
          </div>
          <div class="form-group">
            <label for="fName">이름</label>
            <input type="text" id="fName" placeholder="이름" autocomplete="name">
          </div>
          <div class="form-group">
            <label for="fPhone">연락처</label>
            <input type="tel" id="fPhone" placeholder="01012345678" inputmode="numeric" autocomplete="tel" maxlength="13">
          </div>
        </div>

        <div class="form-group">
          <label>시작 시간</label>
          <div class="time-row"><select id="sH"></select><select id="sM"></select></div>
        </div>
        <div class="form-group">
          <label>종료 시간</label>
          <div class="time-row"><select id="eH"></select><select id="eM"></select></div>
        </div>

        <div class="form-group">
          <label>장소</label>
          <div class="room-grid" id="roomGrid"></div>
        </div>

        <div class="form-group">
          <label for="fPurpose">사용목적</label>
          <textarea id="fPurpose" rows="2" placeholder="사용목적"></textarea>
        </div>
        <div class="form-group">
          <label for="fPeople">사용인원</label>
          <input type="number" id="fPeople" placeholder="인원수" min="1" inputmode="numeric">
        </div>
        <div class="form-group" id="repeatGroup">
          <label>반복 예약</label>
          <div class="repeat-opts" id="repeatOpts"></div>
        </div>
        <div class="form-group hidden" id="repeatEndGroup">
          <label for="repeatEnd">반복 종료 날짜</label>
          <input type="date" id="repeatEnd">
        </div>
      </div>

      <div class="side-panel">
        <div class="side-title">당일 예약 현황</div>
        <div id="sidePanel"></div>
      </div>
    </div>

    <button class="btn btn-primary" id="saveBtn">등록</button>
    <button class="btn btn-danger hidden" id="delBtn">예약 취소</button>
    <button class="btn btn-secondary" id="backBtn">돌아가기</button>
  </div>

  <!-- ══ 날짜별 예약 현황 ══ -->
  <div id="statusScreen" class="screen">
    <div class="date-header"><h2 id="statusDate"></h2></div>
    <button class="btn btn-primary" id="statusAddBtn" style="margin-top:0;margin-bottom:16px;">
      <span style="font-size:20px;">＋</span> 일정 추가
    </button>
    <div id="statusEvents"></div>
    <div id="statusList"></div>
    <button class="btn btn-secondary" id="statusBackBtn">돌아가기</button>
  </div>
</div>

<div class="loading" id="loading">
  <div class="loading-spinner"><div class="spinner"></div><div style="font-weight:bold;">처리중...</div></div>
</div>
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-buttons" id="modalButtons"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc,
  updateDoc, deleteDoc, query, where, onSnapshot,
  writeBatch, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgYFZSo3KI9ycQH6c_es3RDvKYWMYbjaQ",
  authDomain: "gw-reservation-4e4a1.firebaseapp.com",
  projectId: "gw-reservation-4e4a1",
  storageBucket: "gw-reservation-4e4a1.firebasestorage.app",

  appId: "1:865557238486:web:0392dd98b3442aa0d6af77",
  measurementId: "G-EVJ8Q86MWZ"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── 상태 ──
let curY = new Date().getFullYear();
let curM = new Date().getMonth() + 1;
let rooms = [], monthResv = [], monthEvents = {}, holidays = {};
let operatingHours = { openTime:'08:00', closeTime:'24:00' };
let selRoom = null, selRepeat = '없음', editingId = null;
let unsubMonth = null;
let myPhone = '', myName = '';

const FALLBACK_HOLIDAYS = {
  '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날',
  '2026-03-01':'삼일절','2026-05-05':'어린이날','2026-05-24':'석가탄신일',
  '2026-06-06':'현충일','2026-08-15':'광복절','2026-09-24':'추석','2026-09-25':'추석',
  '2026-09-26':'추석','2026-10-03':'개천절','2026-10-09':'한글날','2026-12-25':'성탄절',
  '2027-01-01':'신정'
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const DOW = ['일','월','화','수','목','금','토'];
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

function fmtPhone(p){
  const n = String(p).replace(/[^0-9]/g,'');
  return n.length === 11 ? `${n.slice(0,3)}-${n.slice(3,7)}-${n.slice(7)}` : n;
}
function fmtK(ds){
  const [y,m,d] = ds.split('-');
  return `${y}년 ${+m}월 ${+d}일 (${DOW[new Date(ds+'T00:00:00').getDay()]})`;
}
function overlap(s1,e1,s2,e2){ return !(e1<=s2 || s1>=e2); }
function roomShort(name){
  if(!name) return '?';
  const core = String(name).replace(/[\(（][^)）]*[\)）]\s*$/,'').trim() || String(name);
  const m = core.match(/[A-Za-z0-9]+$/);
  return core.charAt(0) + (m ? m[0] : '');
}
function roomPlain(name){ return String(name||'').replace(/[\(（][^)）]*[\)）]\s*$/,'').trim() || String(name||''); }
function showLoading(s){ $('loading').classList.toggle('show', s); }

let modalCb = null;
function showAlert(msg, cb){
  $('modalMessage').textContent = msg;
  $('modalButtons').innerHTML = '<button style="background:#4CAF50;color:#fff;">확인</button>';
  $('modalButtons').firstChild.onclick = () => closeModal(true);
  modalCb = cb || null;
  $('modal').classList.add('show');
}
function showConfirm(msg, cb){
  $('modalMessage').textContent = msg;
  $('modalButtons').innerHTML =
    '<button style="background:#757575;color:#fff;">아니오</button>' +
    '<button style="background:#4CAF50;color:#fff;">예</button>';
  const [no,yes] = $('modalButtons').children;
  no.onclick = () => closeModal(false);
  yes.onclick = () => closeModal(true);
  modalCb = cb;
  $('modal').classList.add('show');
}
function closeModal(run){
  $('modal').classList.remove('show');
  if(run && modalCb){ const cb = modalCb; modalCb = null; cb(); }
  else modalCb = null;
}

// ── 기기 기억 (로그인 대체) ──
function loadIdentity(){
  try{
    myName = localStorage.getItem('gw_name') || '';
    myPhone = localStorage.getItem('gw_phone') || '';
  }catch{ myName=''; myPhone=''; }
}
function saveIdentity(name, phone){
  myName = name; myPhone = phone;
  try{
    localStorage.setItem('gw_name', name);
    localStorage.setItem('gw_phone', phone);
  }catch{}
}
function clearIdentity(){
  myName=''; myPhone='';
  try{ localStorage.removeItem('gw_name'); localStorage.removeItem('gw_phone'); }catch{}
}

// ── 화면 전환 ──
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
  if(id !== 'calScreen') history.pushState({s:id},'','');
}
history.pushState({s:'calScreen'},'','');
window.addEventListener('popstate', ()=>{
  const a = document.querySelector('.screen.active')?.id;
  if(a !== 'calScreen'){ show('calScreen'); }
  else history.pushState({s:'calScreen'},'','');
});

// ── 초기 데이터 ──
async function loadRooms(){
  const snap = await getDocs(collection(db,'rooms'));
  rooms = snap.docs.map(d=>({id:d.id,...d.data()}))
    .filter(r=>r.active !== false)
    .sort((a,b)=>((a.order??999)-(b.order??999)) ||
      String(a.name||'').localeCompare(String(b.name||''),'ko'));
}
async function loadSettings(){
  try{
    const snap = await getDoc(doc(db,'settings','operatingHours'));
    if(snap.exists()){
      const d = snap.data();
      if(d.openTime) operatingHours.openTime = d.openTime;
      if(d.closeTime) operatingHours.closeTime = d.closeTime;
      holidays = d.holidays || FALLBACK_HOLIDAYS;
    } else holidays = FALLBACK_HOLIDAYS;
  }catch{ holidays = FALLBACK_HOLIDAYS; }
}
async function loadEvents(start,end){
  monthEvents = {};
  try{
    const snap = await getDocs(query(collection(db,'events'),
      where('date','>=',start), where('date','<=',end)));
    snap.forEach(d=>{
      const e = d.data();
      if(!e.date || !e.name) return;
      (monthEvents[e.date] = monthEvents[e.date] || []).push(e.name);
    });
  }catch{ monthEvents = {}; }
}

// ── 월 구독 ──
function subscribeMonth(){
  if(unsubMonth){ unsubMonth(); unsubMonth = null; }
  $('liveDot').classList.remove('on');
  const start = `${curY}-${pad(curM)}-01`, end = `${curY}-${pad(curM)}-31`;
  const q = query(collection(db,'reservations'),
    where('date','>=',start), where('date','<=',end));
  showLoading(true);
  loadEvents(start,end).finally(()=>{
    unsubMonth = onSnapshot(q, snap=>{
      monthResv = snap.docs.map(d=>({id:d.id,...d.data()}));
      renderCal(); renderMy();
      $('liveDot').classList.add('on');
      showLoading(false);
    }, err=>{ showLoading(false); showAlert('데이터 로드 실패: '+err.message); });
  });
}
function changeMonth(d){
  curM += d;
  if(curM>12){ curM=1; curY++; }
  if(curM<1){ curM=12; curY--; }
  subscribeMonth();
}
$('prevBtn').onclick = ()=>changeMonth(-1);
$('nextBtn').onclick = ()=>changeMonth(1);

// ── 달력 ──
function renderCal(){
  $('curY').textContent = curY; $('curM').textContent = curM;
  const firstDow = new Date(curY,curM-1,1).getDay();
  const lastDate = new Date(curY,curM,0).getDate();
  const prevLast = new Date(curY,curM-1,0).getDate();
  const today = todayStr();

  const byDate = {};
  monthResv.forEach(r=>{
    if(!byDate[r.date]) byDate[r.date] = {};
    if(!byDate[r.date][r.roomId]) byDate[r.date][r.roomId] = {n:0,mine:false};
    byDate[r.date][r.roomId].n++;
    if(myPhone && r.phone === myPhone) byDate[r.date][r.roomId].mine = true;
  });

  const tb = $('calBody'); tb.innerHTML = '';
  let date = 1, next = 1;
  for(let i=0;i<6;i++){
    const tr = document.createElement('tr');
    for(let j=0;j<7;j++){
      const td = document.createElement('td');
      if(i===0 && j<firstDow){
        td.innerHTML = `<div class="date-number">${prevLast-firstDow+j+1}</div>`;
        td.classList.add('other-month');
      } else if(date>lastDate){
        td.innerHTML = `<div class="date-number">${next++}</div>`;
        td.classList.add('other-month');
      } else {
        const ds = `${curY}-${pad(curM)}-${pad(date)}`;
        let h = `<div class="date-number">${date}</div>`;
        (monthEvents[ds]||[]).forEach(n=>{ h += `<span class="event-label">${n}</span>`; });
        if(byDate[ds]){
          rooms.forEach(rm=>{
            const c = byDate[ds][rm.id];
            if(c) h += `<span class="badge ${c.mine?'my':'other'}" data-d="${ds}">${roomShort(rm.name)}(${c.n})</span>`;
          });
        }
        td.innerHTML = h;
        td.onclick = ()=>openStatus(ds);
        if(ds===today) td.classList.add('today');
        if(j===0 || holidays[ds]) td.classList.add('sunday');
        else if(j===6) td.classList.add('saturday');
        date++;
      }
      tr.appendChild(td);
    }
    tb.appendChild(tr);
    if(date>lastDate && next>7) break;
  }
}

// ── 내 예약 ──
function renderMy(){
  const c = $('myList');
  if(!myPhone){
    c.innerHTML = '<div class="empty-msg">일정을 추가하면 이곳에<br>내 예약이 표시됩니다.</div>';
    return;
  }
  const mine = monthResv.filter(r=>r.phone===myPhone)
    .sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));
  if(!mine.length){
    c.innerHTML = '<div class="empty-msg">이번 달 예약 내역이 없습니다.</div>';
    return;
  }
  c.innerHTML = '';
  mine.forEach(r=>{
    const rm = rooms.find(x=>x.id===r.roomId);
    const item = document.createElement('div');
    item.className = 'resv-item';
    item.innerHTML = `
      <div style="flex:1;">
        <div class="resv-date">${fmtK(r.date)}</div>
        <div class="resv-room">${rm ? rm.name : (r.roomName||'')}</div>
        <div class="resv-time">${r.startTime} ~ ${r.endTime}</div>
        <div class="resv-info">${r.purpose} | ${r.people}명</div>
      </div>
      <div class="btn-group">
        <button class="btn-mini btn-edit">수정</button>
        <button class="btn-mini btn-cancel">취소</button>
      </div>`;
    item.querySelector('.btn-edit').onclick = ()=>openAdd(r.date, r);
    item.querySelector('.btn-cancel').onclick = ()=>{
      showConfirm('정말 취소하시겠습니까?', async ()=>{
        showLoading(true);
        try{ await deleteDoc(doc(db,'reservations',r.id)); showAlert('예약이 취소되었습니다.'); }
        catch(e){ showAlert('취소 실패: '+e.message); }
        finally{ showLoading(false); }
      });
    };
    c.appendChild(item);
  });
}

// ── 날짜별 현황 ──
let statusDateStr = null;
function openStatus(ds){
  statusDateStr = ds;
  $('statusDate').textContent = fmtK(ds);

  // 관리자가 등록한 특별행사
  const evs = monthEvents[ds] || [];
  $('statusEvents').innerHTML = evs.length
    ? `<div class="event-box">
        <div class="eb-title">📌 특별행사</div>
        ${evs.map(n=>`<div class="eb-name">${n}</div>`).join('')}
      </div>`
    : '';

  const list = monthResv.filter(r=>r.date===ds);
  const c = $('statusList'); c.innerHTML = '';
  rooms.forEach(rm=>{
    const entries = list.filter(r=>r.roomId===rm.id)
      .sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const sec = document.createElement('div');
    sec.className = 'loc-section';
    let h = `<div class="loc-header">${rm.name}</div>`;
    if(entries.length){
      entries.forEach(r=>{
        h += `<div class="loc-entry">
          <div class="entry-time">${r.startTime} ~ ${r.endTime}</div>
          <div class="entry-info">예약자: ${r.name}</div>
          <div class="entry-info">사용목적: ${r.purpose}</div>
          <div class="entry-info">사용인원: ${r.people}명</div>
        </div>`;
      });
    } else h += '<div class="loc-entry none">예약 없음</div>';
    sec.innerHTML = h;
    c.appendChild(sec);
  });
  show('statusScreen');
}
$('statusAddBtn').onclick = ()=>openAdd(statusDateStr || todayStr());
$('statusBackBtn').onclick = ()=>show('calScreen');

// ── 폼 초기화 ──
function initTimeSelects(){
  const openH = parseInt(operatingHours.openTime.split(':')[0]);
  const closeH = parseInt(operatingHours.closeTime.split(':')[0]) || 24;
  [['sH',9],['eH',10]].forEach(([id,def])=>{
    const s = $(id); s.innerHTML = '';
    for(let i=openH;i<=closeH;i++) s.add(new Option(i+'시', pad(i)));
    if([...s.options].some(o=>o.value===pad(def))) s.value = pad(def);
  });
  ['sM','eM'].forEach(id=>{
    const s = $(id); s.innerHTML = '';
    for(let i=0;i<60;i+=10) s.add(new Option(i+'분', pad(i)));
  });
}
function renderRoomCards(){
  const g = $('roomGrid'); g.innerHTML = '';
  if(!rooms.length){
    g.innerHTML = '<div class="empty-msg">등록된 장소가 없습니다.</div>';
    return;
  }
  rooms.forEach(rm=>{
    const d = document.createElement('div');
    d.className = 'room-card';
    d.dataset.rid = rm.id;
    d.innerHTML = `<div class="room-name">${roomPlain(rm.name)}</div>` +
      (rm.capacity ? `<div class="room-meta">정원 ${rm.capacity}명</div>` : '');
    d.onclick = ()=>{
      g.querySelectorAll('.room-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected'); selRoom = rm.id;
    };
    g.appendChild(d);
  });
}
function initRepeat(){
  const c = $('repeatOpts'); c.innerHTML = '';
  ['없음','매일','매주'].forEach((o,i)=>{
    const d = document.createElement('div');
    d.className = 'repeat-opt' + (i===0?' selected':'');
    d.textContent = o;
    d.onclick = ()=>{
      c.querySelectorAll('.repeat-opt').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected'); selRepeat = o;
      $('repeatEndGroup').classList.toggle('hidden', o==='없음');
    };
    c.appendChild(d);
  });
}

// ── 일정 추가/수정 화면 ──
function openAdd(ds, resv){
  editingId = resv ? resv.id : null;
  $('addDate').value = ds || todayStr();
  onDateChange();

  $('fName').value = resv ? resv.name : myName;
  $('fPhone').value = resv ? resv.phone : myPhone;

  if(resv){
    const [sh,sm] = resv.startTime.split(':');
    const [eh,em] = resv.endTime.split(':');
    $('sH').value = sh; $('sM').value = sm;
    $('eH').value = eh; $('eM').value = em;
    $('fPurpose').value = resv.purpose || '';
    $('fPeople').value = resv.people || '';
    selRoom = resv.roomId;
    $('repeatGroup').classList.add('hidden');
    $('repeatEndGroup').classList.add('hidden');
    $('saveBtn').textContent = '수정';
    $('delBtn').classList.remove('hidden');
  } else {
    $('sH').value = pad(Math.max(9, parseInt(operatingHours.openTime)));
    $('sM').value = '00';
    $('eH').value = pad(Math.max(10, parseInt(operatingHours.openTime)+1));
    $('eM').value = '00';
    $('fPurpose').value = ''; $('fPeople').value = '';
    selRoom = null; selRepeat = '없음';
    $('repeatEnd').value = '';
    $('repeatGroup').classList.remove('hidden');
    $('repeatEndGroup').classList.add('hidden');
    document.querySelectorAll('#repeatOpts .repeat-opt').forEach((o,i)=>o.classList.toggle('selected', i===0));
    $('saveBtn').textContent = '등록';
    $('delBtn').classList.add('hidden');
  }
  document.querySelectorAll('#roomGrid .room-card').forEach(c=>
    c.classList.toggle('selected', c.dataset.rid === selRoom));
  show('addScreen');
}
$('addBtn').onclick = ()=>openAdd(todayStr());
$('backBtn').onclick = ()=>show('calScreen');
$('addDate').onchange = onDateChange;

function onDateChange(){
  const ds = $('addDate').value;
  $('addDow').textContent = ds ? '('+DOW[new Date(ds+'T00:00:00').getDay()]+')' : '';
  renderSide(ds);
}
function renderSide(ds){
  const c = $('sidePanel');
  const list = monthResv.filter(r=>r.date===ds);
  if(!list.length){
    c.innerHTML = '<div class="side-empty">예약 없음</div>';
    return;
  }
  const byRoom = {};
  list.forEach(r=>{ (byRoom[r.roomId] = byRoom[r.roomId] || []).push(r); });
  c.innerHTML = rooms.filter(rm=>byRoom[rm.id]).map(rm=>
    `<div class="side-room">
      <div class="side-room-name">${roomPlain(rm.name)}</div>
      ${byRoom[rm.id].sort((a,b)=>a.startTime.localeCompare(b.startTime))
        .map(r=>`<div class="side-slot">
            <span class="ss-time">${r.startTime}~${r.endTime}</span>
            <span class="ss-purpose">${r.purpose||''}</span>
          </div>`).join('')}
    </div>`).join('');
}

$('resetIdBtn').onclick = ()=>{
  showConfirm('저장된 예약자 정보를 지울까요?\n\n지우면 이 기기에서 "내 예약 현황"이\n표시되지 않습니다.', ()=>{
    clearIdentity();
    $('fName').value = ''; $('fPhone').value = '';
    renderCal(); renderMy();
  });
};

// ── 반복 날짜 ──
function getRepeatDates(start, type, end){
  const dates = [start];
  if(type==='없음') return dates;
  const e = new Date(end+'T00:00:00');
  const cur = new Date(start+'T00:00:00');
  const step = type==='매일' ? 1 : 7;
  while(true){
    cur.setDate(cur.getDate()+step);
    if(cur>e) break;
    dates.push(`${cur.getFullYear()}-${pad(cur.getMonth()+1)}-${pad(cur.getDate())}`);
  }
  return dates;
}
async function findConflicts(dates, roomId, s, e, excludeId){
  const room = rooms.find(r=>r.id===roomId);
  const limit = room?.capacityLimit || 1;
  const conflicts = [];
  for(let i=0;i<dates.length;i+=10){
    const chunk = dates.slice(i,i+10);
    const snap = await getDocs(query(collection(db,'reservations'),
      where('roomId','==',roomId), where('date','in',chunk)));
    const cnt = {};
    snap.forEach(d=>{
      if(excludeId && d.id===excludeId) return;
      const r = d.data();
      if(overlap(s,e,r.startTime,r.endTime)) cnt[r.date] = (cnt[r.date]||0)+1;
    });
    chunk.forEach(dt=>{ if((cnt[dt]||0)>=limit) conflicts.push(dt); });
  }
  return conflicts;
}

// ── 저장 ──
$('saveBtn').onclick = async ()=>{
  const date = $('addDate').value;
  const name = $('fName').value.trim();
  const phoneRaw = $('fPhone').value.trim().replace(/[^0-9]/g,'');
  const startTime = $('sH').value+':'+$('sM').value;
  const endTime = $('eH').value+':'+$('eM').value;
  const purpose = $('fPurpose').value.trim();
  const people = $('fPeople').value.trim();

  if(!date) return showAlert('날짜를 선택해주세요.');
  if(!name) return showAlert('이름을 입력해주세요.');
  if(!/^\d{10,11}$/.test(phoneRaw)) return showAlert('올바른 연락처를 입력해주세요.\n(숫자만 10-11자리)');
  if(!selRoom) return showAlert('장소를 선택해주세요.');
  if(!purpose) return showAlert('사용목적을 입력해주세요.');
  if(!people) return showAlert('사용인원을 입력해주세요.');
  if(startTime >= endTime) return showAlert('종료 시간은 시작 시간보다 늦어야 합니다.');

  const phone = fmtPhone(phoneRaw);
  const room = rooms.find(r=>r.id===selRoom);

  let dates = [date];
  if(!editingId && selRepeat !== '없음'){
    const rEnd = $('repeatEnd').value;
    if(!rEnd) return showAlert('반복 종료 날짜를 선택해주세요.');
    if(rEnd <= date) return showAlert('종료 날짜는 시작 날짜보다 늦어야 합니다.');
    dates = getRepeatDates(date, selRepeat, rEnd);
  }

  $('saveBtn').disabled = true;
  showLoading(true);
  try{
    const conflicts = await findConflicts(dates, selRoom, startTime, endTime, editingId);
    if(conflicts.length){
      showAlert(`아래 날짜는 이미 예약이 가득 찼습니다.\n\n${conflicts.slice(0,5).join('\n')}${conflicts.length>5?`\n외 ${conflicts.length-5}건`:''}\n\n다른 시간이나 장소를 선택해주세요.`);
      return;
    }
    saveIdentity(name, phone);
    setDoc(doc(db,'users',phone), { name, lastVisit: serverTimestamp() }, {merge:true}).catch(()=>{});

    if(editingId){
      await updateDoc(doc(db,'reservations',editingId), {
        date, name, phone, startTime, endTime,
        roomId:selRoom, roomName:room.name, purpose, people:Number(people)
      });
      showAlert('예약이 수정되었습니다.', ()=>show('calScreen'));
    } else {
      const gid = 'G'+Date.now();
      for(let i=0;i<dates.length;i+=400){
        const batch = writeBatch(db);
        dates.slice(i,i+400).forEach(dt=>{
          batch.set(doc(collection(db,'reservations')), {
            reservationGroupId: gid, phone, name, date: dt,
            startTime, endTime, roomId: selRoom, roomName: room.name,
            purpose, people: Number(people), createdAt: serverTimestamp()
          });
        });
        await batch.commit();
      }
      showAlert(`예약이 등록되었습니다.${dates.length>1?`\n(총 ${dates.length}건)`:''}`, ()=>show('calScreen'));
    }
    renderCal(); renderMy();
  }catch(e){
    showAlert('저장 실패: '+e.message);
  }finally{
    showLoading(false);
    $('saveBtn').disabled = false;
  }
};

$('delBtn').onclick = ()=>{
  if(!editingId) return;
  showConfirm('정말 취소하시겠습니까?', async ()=>{
    showLoading(true);
    try{
      await deleteDoc(doc(db,'reservations',editingId));
      showAlert('예약이 취소되었습니다.', ()=>show('calScreen'));
    }catch(e){ showAlert('취소 실패: '+e.message); }
    finally{ showLoading(false); }
  });
};

// ── 시작 ──
(async function init(){
  showLoading(true);
  loadIdentity();
  try{
    await Promise.all([loadRooms(), loadSettings()]);
    initTimeSelects();
    renderRoomCards();
    initRepeat();
    subscribeMonth();
  }catch(e){
    showLoading(false);
    showAlert('초기화 실패: '+e.message);
  }
})();
</script>
